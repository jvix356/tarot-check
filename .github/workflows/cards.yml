name: Card illustrations
on:
  push:
    branches: [main]
    paths:
      - 'cards/**'
      - '!cards/manifest.json'
      - 'scripts/build-cards.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cards
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resize and build manifest
        run: |
          npm i --no-save --no-package-lock --no-audit --no-fund sharp@0.33.5
          node scripts/build-cards.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "Update card illustrations" && git push)
