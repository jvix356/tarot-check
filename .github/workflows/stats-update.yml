name: Stats update
# 매일 오전 6시(한국 시간)쯤 익명 통계 공개 요약을 data/stats.json으로 갱신해요.
# 바뀐 게 있을 때만 커밋하고, 커밋되면 Vercel이 자동으로 다시 배포해요.
on:
  schedule:
    - cron: '13 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update stats
        run: node scripts/update-stats.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/stats.json && ! git ls-files --others --exclude-standard data | grep -q .; then
            echo "바뀐 통계가 없어요."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "통계 자동 갱신: data/stats.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
